[workspace]
resolver = "3"
members = ["ftml_analyzer", "ftml_lsp", "lsp_driver", "lsp_test", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ftml_analyzer = { path = "ftml_analyzer", features = ["debug"] }
ftml_lsp = { path = "ftml_lsp" }
lsp_test = { path = "lsp_test" }

# dependencies
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "0.97"

[profile.debug]
strip = false
lto = false
codegen-units = 64
panic = "abort"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
