[package]
name = "ftml_analyzer"
version = "0.1.0"
authors = ["wasd243"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bless = []

[dependencies]
ftml = "1.42"
regex = "1.13"
line-index = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
