[package]
name = "ftml_handler"
version = "0.1.0"
authors = ["wasd243"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bless = []

[dependencies]
ftml = "1.42"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
regex = "1.13"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
