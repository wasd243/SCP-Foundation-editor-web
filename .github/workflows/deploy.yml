name: Deploy VS Code Web

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode_web
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/vscode_web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/vscode_web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run package

      - name: Build GitHub Pages site
        run: node scripts/build-pages.mjs ${{ github.ref_name == 'dev' && '/SCP-Foundation-editor-web/dev' || '/SCP-Foundation-editor-web' }}

      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: extensions/vscode_web/pages
          destination_dir: ${{ github.ref_name == 'dev' && 'dev' || '' }}
          keep_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: ftml-analyzer-web-vsix
          path: extensions/vscode_web/*.vsix
          if-no-files-found: error
