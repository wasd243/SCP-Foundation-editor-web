[package]
name = "ftml_lsp_wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ftml_analyzer.workspace = true
ftml_lsp.workspace = true
lsp-server = "0.10.0"
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals"]
